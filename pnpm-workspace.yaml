minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.12"
  - "@turbo/darwin-arm64@2.11.12"
  - "@turbo/linux-64@2.11.12"
  - "@turbo/linux-arm64@2.11.12"
  - "@turbo/windows-64@2.11.12"
  - "@turbo/windows-arm64@2.11.12"
  - turbo@2.11.12
  - "@ui-sdk/react@0.1.0-beta.10"
  - "@ui-sdk/core@0.1.0-beta.10"
  - electron@45.5.0
nodeLinker: hoisted
# pnpm 12 uses allowBuilds, the replacement for onlyBuiltDependencies.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
packages:
  - apps/*
  - packages/*

catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.2
  "@react-router/dev": ^8.5.2
  "@react-router/fs-routes": ^8.5.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^22.20.5
  vite: ^8.3.8
  electron-vite: ^6.0.0
  electron-builder: ^26.18.0
  vitest: ^5.1.1
  "@vitejs/plugin-react": ^6.3.0
  tailwindcss: ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  typescript: ^7.0.2
  oxlint: ^1.94.0
  oxfmt: ^0.79.0
