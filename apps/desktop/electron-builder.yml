# yaml-language-server: $schema=../../node_modules/app-builder-lib/scheme.json
appId: com.rk.desktop
productName: rk Desktop
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
